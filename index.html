<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chess Companion Hub</title>

  <!-- ================================================================
       DEPENDENCIES (CDN only, pinned versions — see CLAUDE.md)
       Order matters: jQuery must load before chessboard.js.
       ================================================================ -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <style>
    /* Small amount of custom CSS for things Tailwind utilities can't express cleanly. */
    html, body { background-color: #0f172a; /* slate-900 */ }
    /* Tabular digits keep the clock from jittering as numbers change. */
    .tabular { font-variant-numeric: tabular-nums; }

    /* ---- chessboard.js theme overrides (class names come from chessboard.js) ---- */
    /* No border on the board itself (it would widen it past its container); the wrapper draws a ring. */
    #play-board .board-b72b1 { border: 0; }
    #view-play { scrollbar-gutter: stable; } /* stable width, so sizing the board can't toggle a scrollbar */
    /* Side panel beside the board on wide screens AND on landscape phones/tablets, where stacking
       would push the board off-screen. Keep this query in sync with Play.SIDE_BY_SIDE. */
    @media (min-width: 1024px), (orientation: landscape) and (min-width: 640px) {
      #view-play .play-layout { flex-direction: row; align-items: flex-start; justify-content: center; }
      #view-play .play-aside  { width: 20rem; flex-shrink: 0; }
    }
    #play-board .white-1e1d7 { background-color: #dfe5ec; color: #6b7f95; }
    #play-board .black-3c85d { background-color: #6b7f95; color: #dfe5ec; }
    #play-board .square-55d63 { position: relative; }
    /* Highlights are drawn with inset shadows / gradients so the square colour still shows through. */
    #play-board .sq-last     { box-shadow: inset 0 0 0 999px rgba(16, 185, 129, 0.32); }   /* emerald-500 */
    #play-board .sq-selected { box-shadow: inset 0 0 0 999px rgba(16, 185, 129, 0.55); }
    #play-board .sq-check    { background-image: radial-gradient(circle, rgba(239, 68, 68, 0.95) 0%, rgba(239, 68, 68, 0.55) 45%, transparent 75%); }
    #play-board .sq-target::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle, rgba(15, 23, 42, 0.35) 18%, transparent 20%);
    }
    #play-board .sq-capture::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle, transparent 62%, rgba(15, 23, 42, 0.4) 64%);
    }
  </style>

  <!-- Reusable component classes, built from Tailwind utilities. -->
  <style type="text/tailwindcss">
    @layer components {
      .clock-side { -webkit-tap-highlight-color: transparent; @apply select-none touch-manipulation relative flex min-h-0 flex-1 cursor-pointer items-center justify-center overflow-hidden rounded-2xl transition-colors duration-150 focus:outline-none focus-visible:ring-4 focus-visible:ring-emerald-300; }
      .ctrl-btn   { @apply flex items-center gap-1 rounded-xl bg-slate-800 px-2.5 py-2 sm:gap-1.5 sm:px-3 text-sm font-medium text-slate-200 transition hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-slate-800; }
      .preset-btn { @apply rounded-xl border border-slate-700 bg-slate-900 px-3 py-2.5 text-left font-semibold transition hover:border-emerald-500; }
      .player-bar { @apply flex items-center justify-between gap-2 rounded-xl bg-slate-800 px-3 py-1.5 transition; }
      .num-input  { @apply mt-1 w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-base text-slate-100 focus:border-emerald-500 focus:outline-none; }
    }
  </style>
</head>

<body class="h-full bg-slate-900 text-slate-100 antialiased">
  <div class="flex h-full flex-col">

    <!-- ================================================================
         TOP NAVIGATION — three tabs
         ================================================================ -->
    <header class="flex shrink-0 items-center justify-between gap-3 border-b border-slate-800 bg-slate-900/95 px-4 py-2">
      <div class="flex items-center gap-2 font-semibold">
        <span class="text-2xl text-emerald-500" aria-hidden="true">&#9822;</span>
        <span class="hidden sm:inline">Chess Companion Hub</span>
      </div>
      <nav class="flex gap-1 rounded-xl bg-slate-800 p-1" role="tablist" aria-label="Sections">
        <button class="tab-btn rounded-lg px-3 py-1.5 text-sm font-medium transition" role="tab" data-tab="clock" aria-controls="view-clock">Clock</button>
        <button class="tab-btn rounded-lg px-3 py-1.5 text-sm font-medium transition" role="tab" data-tab="play" aria-controls="view-play">Play</button>
        <button class="tab-btn rounded-lg px-3 py-1.5 text-sm font-medium transition" role="tab" data-tab="facts" aria-controls="view-facts">Facts</button>
      </nav>
      <button id="sound-toggle" class="rounded-lg bg-slate-800 px-3 py-1.5 text-sm text-slate-300 transition hover:bg-slate-700" aria-pressed="true" title="Toggle sound">
        <span id="sound-icon" aria-hidden="true">&#128266;</span><span class="sr-only">Sound</span>
      </button>
    </header>

    <main class="relative min-h-0 flex-1">

      <!-- ================================================================
           TAB 1: DUAL CHESS CLOCK
           ================================================================ -->
      <section id="view-clock" class="tab-view hidden h-full" role="tabpanel">
        <!-- Portrait: halves stacked, top half rotated 180° for the player across the table.
             Landscape: halves side by side, no rotation. -->
        <div class="flex h-full flex-col gap-2 p-2 landscape:flex-row">

          <!-- Top (portrait) / left (landscape) half -->
          <button id="clock-top" class="clock-side" aria-live="off">
            <div class="clock-face flex flex-col items-center gap-2 portrait:rotate-180">
              <span class="clock-name text-sm font-semibold uppercase tracking-widest"></span>
              <span class="clock-time tabular font-bold leading-none" style="font-size: clamp(3.5rem, 18vmin, 11rem)"></span>
              <span class="clock-info text-sm font-medium"></span>
              <span class="clock-flag mt-2 hidden animate-pulse rounded-xl bg-red-950/90 px-6 py-2 text-3xl font-black tracking-wider text-red-50">FLAGGED!</span>
            </div>
          </button>

          <!-- Control strip between the halves -->
          <div class="flex shrink-0 flex-wrap items-center justify-center gap-1.5 sm:gap-2 landscape:flex-col landscape:flex-nowrap">
            <button id="clock-pause" class="ctrl-btn"><span aria-hidden="true">&#10074;&#10074;</span><span class="ctrl-label">Pause</span></button>
            <button id="clock-reset" class="ctrl-btn"><span aria-hidden="true">&#8634;</span><span>Reset</span></button>
            <button id="clock-swap" class="ctrl-btn"><span aria-hidden="true">&#8645;</span><span>Swap</span></button>
            <button id="clock-settings-btn" class="ctrl-btn" title="Time control"><span aria-hidden="true">&#9201;</span><span id="clock-control-label" class="tabular">5 | 0</span></button>
            <button id="clock-fullscreen" class="ctrl-btn" title="Full screen"><span aria-hidden="true">&#9974;</span><span class="ctrl-label hidden sm:inline">Full</span></button>
          </div>

          <!-- Bottom (portrait) / right (landscape) half -->
          <button id="clock-bottom" class="clock-side" aria-live="off">
            <div class="clock-face flex flex-col items-center gap-2">
              <span class="clock-name text-sm font-semibold uppercase tracking-widest"></span>
              <span class="clock-time tabular font-bold leading-none" style="font-size: clamp(3.5rem, 18vmin, 11rem)"></span>
              <span class="clock-info text-sm font-medium"></span>
              <span class="clock-flag mt-2 hidden animate-pulse rounded-xl bg-red-950/90 px-6 py-2 text-3xl font-black tracking-wider text-red-50">FLAGGED!</span>
            </div>
          </button>
        </div>

        <!-- Time-control settings overlay -->
        <div id="clock-settings" class="absolute inset-0 z-20 hidden items-center justify-center bg-slate-950/80 p-4 backdrop-blur-sm">
          <div class="w-full max-w-md rounded-2xl border border-slate-700 bg-slate-800 p-5 shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="clock-settings-title">
            <div class="mb-4 flex items-center justify-between">
              <h2 id="clock-settings-title" class="text-lg font-semibold">Time control</h2>
              <button id="clock-settings-close" class="rounded-lg px-2 py-1 text-slate-400 hover:bg-slate-700 hover:text-slate-100" aria-label="Close">&#10005;</button>
            </div>

            <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Presets</p>
            <div class="mb-5 grid grid-cols-2 gap-2">
              <button class="preset-btn" data-min="1"  data-inc="0"><span class="block text-xs text-slate-400">Bullet</span>1 min</button>
              <button class="preset-btn" data-min="3"  data-inc="0"><span class="block text-xs text-slate-400">Blitz</span>3 min</button>
              <button class="preset-btn" data-min="5"  data-inc="0"><span class="block text-xs text-slate-400">Blitz</span>5 min</button>
              <button class="preset-btn" data-min="10" data-inc="0"><span class="block text-xs text-slate-400">Rapid</span>10 min</button>
            </div>

            <p class="mb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Custom</p>
            <form id="clock-custom" class="grid grid-cols-3 gap-2" novalidate>
              <label class="text-xs text-slate-400">Minutes
                <input name="min" type="number" min="0" max="180" step="1" inputmode="numeric" class="num-input">
              </label>
              <label class="text-xs text-slate-400">Seconds
                <input name="sec" type="number" min="0" max="59" step="1" inputmode="numeric" class="num-input">
              </label>
              <label class="text-xs text-slate-400">Increment (s)
                <input name="inc" type="number" min="0" max="60" step="1" inputmode="numeric" class="num-input">
              </label>
              <p id="clock-custom-error" class="col-span-3 hidden text-sm text-red-400"></p>
              <button type="submit" class="col-span-3 mt-1 rounded-xl bg-emerald-500 py-2.5 font-semibold text-slate-900 transition hover:bg-emerald-400">Apply custom time</button>
            </form>
            <p class="mt-3 text-xs text-slate-500">Changing the time control resets both clocks.</p>
          </div>

           ================================================================ -->
      <section id="view-play" class="tab-view hidden h-full overflow-y-auto" role="tabpanel">
        <div class="play-layout mx-auto flex max-w-6xl flex-col items-center gap-4 p-3 sm:p-4">

          <!-- Board column (its width is set by Play.sizeBoard) -->
          <div id="play-board-col" class="flex max-w-full flex-col gap-2">
            <!-- Player bar for the colour at the top of the board -->
            <div id="play-bar-top" class="player-bar">

                <span class="bar-swatch h-3 w-3 shrink-0 rounded-full"></span>
                <span class="bar-name text-sm font-semibold"></span>

            <!-- Player bar for the colour at the bottom of the board -->

                <span class="bar-swatch h-3 w-3 shrink-0 rounded-full"></span>
                <span class="bar-name text-sm font-semibold"></span>

          <!-- Side panel -->
          <aside class="play-aside flex w-full max-w-xl flex-col gap-3">

            <div class="grid grid-cols-2 gap-2">

            </div>

            <label class="flex items-center justify-between gap-3 rounded-xl bg-slate-800 px-4 py-2.5 text-sm">

      <!-- ================================================================
           TAB 3: FACTS ENGINE
           ================================================================ -->
      <section id="view-facts" class="tab-view hidden h-full overflow-y-auto" role="tabpanel">
        <div class="mx-auto max-w-5xl p-4 sm:p-6">

          <div id="facts-grid" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>

  <script>
  'use strict';

  /* ==================================================================
     SHARED HELPERS
     Used by both the Dual Clock (Tab 1) and the Pass-and-Play mini
     clock (Tab 2): safe storage, time formatting, sounds, and a
     two-sided countdown timer.
     ================================================================== */

  /** localStorage wrapper that never throws (private windows, blocked storage). */
  const Store = {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem('cch:' + key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem('cch:' + key, JSON.stringify(value)); } catch (e) { /* ignore */ }
    },
  };

  /**
   * Format milliseconds for a chess clock.
   * - 10 s or more: "m:ss" (or "h:mm:ss" past an hour), seconds floored.
   * - under 10 s:   "s.t" with tenths, so the final seconds are readable.
   */
  function formatTime(ms) {
    ms = Math.max(0, ms);
    if (ms < 10000) return (Math.floor(ms / 100) / 10).toFixed(1);
    const total = Math.floor(ms / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = String(total % 60).padStart(2, '0');
    return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
  }

  /** Human label for a time control, e.g. "5 | 0" or "1:30 | 2". */
  function controlLabel({ initialMs, incrementMs }) {
    const total = Math.round(initialMs / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    const base = s === 0 ? String(m) : `${m}:${String(s).padStart(2, '0')}`;
    return `${base} | ${Math.round(incrementMs / 1000)}`;
  }

  /**
   * Sound effects synthesised with the Web Audio API (no audio files).
   * Browsers only allow audio after a user gesture, so the AudioContext is
   * created lazily on the first pointer/key press (see unlock()).
   */
  const Sound = {
    ctx: null,
    enabled: Store.get('sound', true),

    unlock() {
      if (Sound.ctx) {
        if (Sound.ctx.state === 'suspended') Sound.ctx.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) Sound.ctx = new AC();
    },

    /** Play one short tone. `delay` (seconds) lets us sequence simple melodies. */
    tone(freq, duration, { type = 'sine', gain = 0.2, delay = 0 } = {}) {
      if (!Sound.enabled || !Sound.ctx) return;
      const t0 = Sound.ctx.currentTime + delay;
      const osc = Sound.ctx.createOscillator();
      const amp = Sound.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      // Quick attack + exponential decay avoids clicks at start/end of the tone.
      amp.gain.setValueAtTime(0.0001, t0);
      amp.gain.exponentialRampToValueAtTime(gain, t0 + 0.005);
      amp.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(amp).connect(Sound.ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    },

    tap()     { Sound.tone(880, 0.06, { type: 'square', gain: 0.08 }); },
    move()    { Sound.tone(520, 0.07, { type: 'triangle', gain: 0.25 }); },
    capture() { Sound.tone(300, 0.10, { type: 'triangle', gain: 0.3 }); Sound.tone(180, 0.12, { type: 'triangle', gain: 0.25, delay: 0.04 }); },
    check()   { Sound.tone(740, 0.09, { type: 'sawtooth', gain: 0.08 }); Sound.tone(988, 0.12, { type: 'sawtooth', gain: 0.08, delay: 0.09 }); },
    flag()    { [0, 0.18, 0.36].forEach((d) => Sound.tone(220, 0.16, { type: 'square', gain: 0.12, delay: d })); },
    gameEnd() { [523, 659, 784].forEach((f, i) => Sound.tone(f, 0.18, { gain: 0.18, delay: i * 0.12 })); },

    setEnabled(on) {
      Sound.enabled = on;
      Store.set('sound', on);
      const btn = document.getElementById('sound-toggle');
      btn.setAttribute('aria-pressed', String(on));
      document.getElementById('sound-icon').innerHTML = on ? '&#128266;' : '&#128263;';
    },

    init() {
      // The first interaction anywhere unlocks audio for the rest of the session.
      ['pointerdown', 'keydown'].forEach((ev) => window.addEventListener(ev, Sound.unlock, { capture: true }));
      document.getElementById('sound-toggle').addEventListener('click', () => Sound.setEnabled(!Sound.enabled));
      Sound.setEnabled(Sound.enabled);
    },
  };

  /**
   * Two-sided countdown timer (side 0 and side 1).
   *
   * Accuracy: remaining time is reduced by real elapsed time measured with
   * performance.now(), so a late or throttled interval tick never loses time.
   * The interval only drives re-rendering and flag detection.
   *
   * States: 'idle' (not started), 'running', 'paused', 'flagged'.
   */
  class ChessTimer {
    constructor({ initialMs, incrementMs, onUpdate = () => {}, onFlag = () => {} }) {
      this.onUpdate = onUpdate;
      this.onFlag = onFlag;
      this.interval = null;
      this.configure(initialMs, incrementMs);
    }

    /** Set a new time control and reset both sides. */
    configure(initialMs, incrementMs) {
      this.initialMs = initialMs;
      this.incrementMs = incrementMs;
      this.reset();
    }

    reset() {
      this._stopLoop();
      this.remaining = [this.initialMs, this.initialMs];
      this.moves = [0, 0];       // completed moves (clock presses) per side
      this.active = null;        // side whose clock is (or was) counting down
      this.flagged = null;       // side that ran out of time
      this.state = 'idle';
      this.onUpdate();
    }

    /** Begin counting down for `side` (first move of a game). */
    start(side) {
      if (this.state !== 'idle') return;
      this.active = side;
      this._run();
    }

    /**
     * The active side completed a move: add its increment and hand the
     * clock to the opponent. Returns false if the press was ignored.
     */
    switchTurn() {
      if (this.state !== 'running') return false;
      this._settle();
      if (this.state === 'flagged') return false; // ran out just before pressing
      this.remaining[this.active] += this.incrementMs;
      this.moves[this.active] += 1;
      this.active = 1 - this.active;
      this.onUpdate();
      return true;
    }

    pause() {
      if (this.state !== 'running') return;
      this._settle();
      if (this.state === 'flagged') return;
      this._stopLoop();
      this.state = 'paused';
      this.onUpdate();
    }

    resume() {
      if (this.state !== 'paused') return;
      this._run();
    }

    /**
     * Hand the clock to `side` without adding increment (used by Undo on the
     * board). Time already spent is not refunded.
     */
    giveTurnTo(side) {
      this._settle();
      if (this.state === 'flagged' || this.state === 'idle') return;
      this.active = side;
      this.lastStamp = performance.now();
      this.onUpdate();
    }

    /** Stop the clock without flagging (e.g. game ended on the board). No-op before the start. */
    stop() {
      if (this.state === 'idle') return;
      this._settle();
      this._stopLoop();
      if (this.state !== 'flagged') this.state = 'paused';
      this.onUpdate();
    }

    /** Remaining ms for a side (already settled on every tick). */
    timeOf(side) { return this.remaining[side]; }

    // ---- internals ----

    _run() {
      this.state = 'running';
      this.lastStamp = performance.now();
      this._stopLoop();
      this.interval = setInterval(() => { this._settle(); this.onUpdate(); }, 50);
      this.onUpdate();
    }

    /** Charge elapsed real time to the active side and detect a flag. */
    _settle() {
      if (this.state !== 'running') return;
      const now = performance.now();
      this.remaining[this.active] -= now - this.lastStamp;
      this.lastStamp = now;
      if (this.remaining[this.active] <= 0) {
        this.remaining[this.active] = 0;
        this.flagged = this.active;
        this.state = 'flagged';
        this._stopLoop();
        this.onFlag(this.active);
      }
    }

    _stopLoop() {
      if (this.interval) clearInterval(this.interval);
      this.interval = null;
    }
  }

  /* ==================================================================
     TABS
     Switches between the three views without reloading. The active tab
     is mirrored in location.hash (#clock, #play, #facts) so a refresh
     keeps you where you were.
     ================================================================== */
  const Tabs = {
    names: ['clock', 'play', 'facts'],
    // Listeners other modules can register, called with the tab name when it becomes visible
    // (e.g. chessboard.js must resize once its container is shown).
    onShow: [],

    init() {
      document.querySelectorAll('.tab-btn').forEach((btn) => {
        btn.addEventListener('click', () => Tabs.show(btn.dataset.tab));
      });
      window.addEventListener('hashchange', () => Tabs.show(Tabs.fromHash()));
      Tabs.show(Tabs.fromHash());
    },

    fromHash() {
      const name = location.hash.slice(1);
      return Tabs.names.includes(name) ? name : 'clock';
    },

    show(name) {
      document.querySelectorAll('.tab-view').forEach((view) => {
        view.classList.toggle('hidden', view.id !== 'view-' + name);
      });
      document.querySelectorAll('.tab-btn').forEach((btn) => {
        const active = btn.dataset.tab === name;
        btn.setAttribute('aria-selected', String(active));
        btn.classList.toggle('bg-emerald-500', active);
        btn.classList.toggle('text-slate-900', active);
        btn.classList.toggle('text-slate-300', !active);
        btn.classList.toggle('hover:bg-slate-700', !active);
      });
      if (location.hash.slice(1) !== name) history.replaceState(null, '', '#' + name);
      Tabs.onShow.forEach((fn) => fn(name));
    },
  };

  /* ==================================================================
     TAB 1: DUAL CHESS CLOCK
     Side 0 = White, side 1 = Black (indices into the ChessTimer).
     Tapping the half of the player whose clock is running ends their
     move: their increment is added and the opponent's clock starts.
     Before the first move, a tap on either half starts White's clock.
     ================================================================== */
  const DualClock = {
    WHITE: 0,
    BLACK: 1,
    timer: null,
    whiteOnBottom: true, // Swap Sides flips which half each colour uses
    control: Store.get('clockControl', { initialMs: 5 * 60000, incrementMs: 0 }),
    wakeLock: null,
    el: {},

    // Colour/state classes for a half; layout classes live in .clock-side.
    STYLES: {
      idle:    'bg-slate-800 text-slate-100 hover:bg-slate-700',
      active:  'bg-emerald-500 text-slate-900',
      low:     'bg-amber-400 text-slate-900',      // active with under 10 s left
      waiting: 'bg-slate-800 text-slate-500',
      paused:  'bg-emerald-950 text-emerald-200 ring-2 ring-inset ring-emerald-700',
      flagged: 'bg-red-600 text-white',
      winner:  'bg-slate-800 text-emerald-400',
    },

    init() {
      const $ = (id) => document.getElementById(id);
      DualClock.el = {
        top: $('clock-top'),
        bottom: $('clock-bottom'),
        pause: $('clock-pause'),
        reset: $('clock-reset'),
        swap: $('clock-swap'),
        settingsBtn: $('clock-settings-btn'),
        controlLabel: $('clock-control-label'),
        fullscreen: $('clock-fullscreen'),
        settings: $('clock-settings'),
        settingsClose: $('clock-settings-close'),
        customForm: $('clock-custom'),
        customError: $('clock-custom-error'),
      };
      const el = DualClock.el;

      DualClock.timer = new ChessTimer({
        initialMs: DualClock.control.initialMs,
        incrementMs: DualClock.control.incrementMs,
        onUpdate: DualClock.render,
        onFlag: DualClock.handleFlag,
      });

      // pointerdown (not click) so a tap registers instantly, with no click delay.
      el.top.addEventListener('pointerdown', (e) => DualClock.onSidePointer(e, 'top'));
      el.bottom.addEventListener('pointerdown', (e) => DualClock.onSidePointer(e, 'bottom'));

      el.pause.addEventListener('click', DualClock.togglePause);
      el.reset.addEventListener('click', DualClock.reset);
      el.swap.addEventListener('click', DualClock.swapSides);
      el.settingsBtn.addEventListener('click', DualClock.openSettings);
      el.settingsClose.addEventListener('click', DualClock.closeSettings);
      el.settings.addEventListener('pointerdown', (e) => { if (e.target === el.settings) DualClock.closeSettings(); });
      el.customForm.addEventListener('submit', DualClock.applyCustom);
      document.querySelectorAll('.preset-btn').forEach((btn) => {
        btn.addEventListener('click', () => DualClock.setControl(Number(btn.dataset.min) * 60000, Number(btn.dataset.inc) * 1000));
      });

      // Fullscreen is optional (unsupported on iPhone Safari): hide the button if missing.
      if (document.documentElement.requestFullscreen) {
        el.fullscreen.addEventListener('click', DualClock.toggleFullscreen);
        document.addEventListener('fullscreenchange', DualClock.render);
      } else {
        el.fullscreen.classList.add('hidden');
      }

      // Control buttons shouldn't keep focus, or Space would re-trigger them.
      document.querySelectorAll('#view-clock .ctrl-btn').forEach((btn) => btn.addEventListener('click', () => btn.blur()));

      document.addEventListener('keydown', DualClock.handleKey);

      // Re-acquire the screen wake lock after returning to the page (browsers drop it when hidden).
      document.addEventListener('visibilitychange', DualClock.syncWakeLock);

      DualClock.render();
    },

    /** Which colour is shown in the given half ('top' or 'bottom'). */
    colorAt(pos) {
      const bottomColor = DualClock.whiteOnBottom ? DualClock.WHITE : DualClock.BLACK;
      return pos === 'bottom' ? bottomColor : 1 - bottomColor;
    },

    /** The half element displaying a colour. */
    sideEl(color) {
      return DualClock.colorAt('bottom') === color ? DualClock.el.bottom : DualClock.el.top;
    },

    settingsOpen() { return !DualClock.el.settings.classList.contains('hidden'); },

    /** Primary-button presses only, so a right-click (context menu) can't end a move. */
    onSidePointer(e, pos) {
      if (e.button !== 0) return;
      e.preventDefault();
      DualClock.press(DualClock.colorAt(pos));
    },

    /** A player tapped their half of the screen. */
    press(color) {
      const t = DualClock.timer;
      if (DualClock.settingsOpen()) return;
      if (t.state === 'idle') {
        t.start(DualClock.WHITE);
        DualClock.feedback();
      } else if (t.state === 'running' && color === t.active) {
        if (t.switchTurn()) DualClock.feedback();
      }
      // Taps on the waiting side, or while paused/flagged, are ignored on purpose
      // so a stray touch can't hand the move to the wrong player.
      DualClock.syncWakeLock();
    },

    /** Sound + a short vibration (on devices that support it) for each clock press. */
    feedback() {
      Sound.tap();
      if (navigator.vibrate) navigator.vibrate(15);
    },

    /** Keyboard: Space/Enter presses the running clock (or starts it); P pauses/resumes. */
    handleKey(e) {
      if (document.getElementById('view-clock').classList.contains('hidden')) return;
      if (DualClock.settingsOpen()) {
        if (e.key === 'Escape') DualClock.closeSettings();
        return;
      }
      // Leave keys alone when a keyboard user has focused another control (tab buttons,
      // Reset, sound toggle...), so Enter/Space still activate it. The clock halves are fine.
      const focused = e.target.closest && e.target.closest('button, input, select, textarea, a');
      if (focused && !focused.classList.contains('clock-side')) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.code === 'Space' || e.key === 'Enter') {
        e.preventDefault();
        const t = DualClock.timer;
        DualClock.press(t.state === 'idle' ? DualClock.WHITE : t.active);
      } else if (e.key === 'p' || e.key === 'P') {
        DualClock.togglePause();
      }
    },

    togglePause() {
      const t = DualClock.timer;
      if (t.state === 'running') t.pause();
      else if (t.state === 'paused') t.resume();
      DualClock.syncWakeLock();
    },

    reset() {
      DualClock.timer.reset();
      DualClock.syncWakeLock();
    },

    /** Swap which half each player uses (e.g. players changed seats). Times follow the player. */
    swapSides() {
      if (DualClock.timer.state === 'running') return;
      DualClock.whiteOnBottom = !DualClock.whiteOnBottom;
      DualClock.render();
    },

    handleFlag() {
      Sound.flag();
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      DualClock.syncWakeLock();
    },

    // ---- time control settings ----

    openSettings() {
      DualClock.timer.pause(); // never let time run behind the dialog
      const { initialMs, incrementMs } = DualClock.control;
      const form = DualClock.el.customForm;
      const totalSec = Math.round(initialMs / 1000);
      form.min.value = Math.floor(totalSec / 60);
      form.sec.value = totalSec % 60;
      form.inc.value = Math.round(incrementMs / 1000);
      DualClock.el.customError.classList.add('hidden');
      DualClock.el.settings.classList.remove('hidden');
      DualClock.el.settings.classList.add('flex');
      DualClock.render();
    },

    closeSettings() {
      DualClock.el.settings.classList.add('hidden');
      DualClock.el.settings.classList.remove('flex');
    },

    /** Validate the custom form; on success apply it. */
    applyCustom(e) {
      e.preventDefault();
      const form = DualClock.el.customForm;
      const read = (input) => (input.value.trim() === '' ? 0 : Number(input.value));
      const min = read(form.min), sec = read(form.sec), inc = read(form.inc);
      const valid = [min, sec, inc].every((n) => Number.isInteger(n) && n >= 0)
        && min <= 180 && sec <= 59 && inc <= 60;
      let error = '';
      if (!valid) error = 'Use whole numbers: minutes 0–180, seconds 0–59, increment 0–60.';
      else if (min === 0 && sec === 0) error = 'Starting time must be more than zero.';
      if (error) {
        DualClock.el.customError.textContent = error;
        DualClock.el.customError.classList.remove('hidden');
        return;
      }
      DualClock.setControl((min * 60 + sec) * 1000, inc * 1000);
    },

    /** Apply a time control (preset or custom), remember it, and reset both clocks. */
    setControl(initialMs, incrementMs) {
      DualClock.control = { initialMs, incrementMs };
      Store.set('clockControl', DualClock.control);
      DualClock.timer.configure(initialMs, incrementMs);
      DualClock.closeSettings();
      DualClock.syncWakeLock();
    },

    // ---- browser integrations ----

    toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    },

    /** Keep the screen awake only while a clock is running (where supported). */
    async syncWakeLock() {
      const want = DualClock.timer.state === 'running' && document.visibilityState === 'visible';
      try {
        if (want && !DualClock.wakeLock && 'wakeLock' in navigator) {
          DualClock.wakeLock = await navigator.wakeLock.request('screen');
          DualClock.wakeLock.addEventListener('release', () => { DualClock.wakeLock = null; });
        } else if (!want && DualClock.wakeLock) {
          await DualClock.wakeLock.release();
          DualClock.wakeLock = null;
        }
      } catch (err) { /* wake lock is a nice-to-have; ignore failures */ }
    },

    // ---- rendering ----

    /** Visual state key (see STYLES) and helper text for one colour. */
    sideState(color) {
      const t = DualClock.timer;
      const moves = `Moves: ${t.moves[color]}`;
      switch (t.state) {
        case 'idle':
          return { style: 'idle', info: color === DualClock.WHITE ? 'Tap anywhere to start' : "Tap to start White's clock" };
        case 'running':
          if (color !== t.active) return { style: 'waiting', info: moves };
          return { style: t.timeOf(color) < 10000 ? 'low' : 'active', info: moves };
        case 'paused':
          return { style: color === t.active ? 'paused' : 'waiting', info: color === t.active ? 'Paused' : moves };
        case 'flagged':
          return color === t.flagged
            ? { style: 'flagged', info: 'Out of time' }
            : { style: 'winner', info: 'Wins on time' };
      }
    },

    render() {
      const t = DualClock.timer;
      const el = DualClock.el;
      if (!t) return; // the ChessTimer constructor fires onUpdate before it's assigned

      [DualClock.WHITE, DualClock.BLACK].forEach((color) => {
        const side = DualClock.sideEl(color);
        const { style, info } = DualClock.sideState(color);
        side.className = 'clock-side ' + DualClock.STYLES[style];
        side.querySelector('.clock-name').textContent = color === DualClock.WHITE ? '♔ White' : '♚ Black';
        side.querySelector('.clock-time').textContent = formatTime(t.timeOf(color));
        side.querySelector('.clock-info').textContent = info;
        side.querySelector('.clock-flag').classList.toggle('hidden', style !== 'flagged');
        side.setAttribute('aria-label', `${color === DualClock.WHITE ? 'White' : 'Black'} clock, ${formatTime(t.timeOf(color))}. ${info}`);
      });

      el.pause.querySelector('.ctrl-label').textContent = t.state === 'paused' ? 'Resume' : 'Pause';
      el.pause.firstElementChild.innerHTML = t.state === 'paused' ? '&#9654;' : '&#10074;&#10074;';
      el.pause.disabled = t.state !== 'running' && t.state !== 'paused';
      el.swap.disabled = t.state === 'running';
      el.controlLabel.textContent = controlLabel(DualClock.control);
      el.fullscreen.querySelector('.ctrl-label').textContent = document.fullscreenElement ? 'Exit' : 'Full';

      // Highlight the preset that matches the current control, if any.
      document.querySelectorAll('.preset-btn').forEach((btn) => {
        const match = Number(btn.dataset.min) * 60000 === DualClock.control.initialMs
          && Number(btn.dataset.inc) * 1000 === DualClock.control.incrementMs;
        btn.classList.toggle('border-emerald-500', match);
        btn.classList.toggle('bg-emerald-500/10', match);
      });
    },
  };

  /* ==================================================================
     TAB 2: LOCAL MULTIPLAYER (Pass-and-Play)
     chess.js owns the game state and validates every move; chessboard.js
     only draws the board and reports drags. After each move the board is
     re-synced from chess.js's FEN, which also takes care of castling,
     en passant and promotion.

     Two ways to move:
     - Drag: chessboard.js calls onDrop(source, target).
     - Tap: tap one of your pieces, then a destination square. Taps are
       detected with pointer events on the board wrapper (pointerdown and
       pointerup on the same square), which work for mouse and touch.

     Mini clock: a ChessTimer (side 0 = White, 1 = Black). Black's clock
     starts when White makes the first move; each later move adds the
     mover's increment and switches sides.
     ================================================================== */
  const Play = {
    PIECE_URL: 'https://cdn.jsdelivr.net/gh/oakmac/chessboardjs@v1.0.0/website/img/chesspieces/wikipedia/{piece}.png',
    PROMOTION_PIECES: [['q', 'Queen'], ['r', 'Rook'], ['b', 'Bishop'], ['n', 'Knight']],
    PIECE_VALUES: { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 },
    // When the side panel sits beside the board (must match the .play-layout CSS media query).
    SIDE_BY_SIDE: '(min-width: 1024px), (orientation: landscape) and (min-width: 640px)',
    // Clock choices: 'none', 'seconds|increment', or 'clock' (copy Tab 1's time control).
    CONTROL_OPTIONS: [
      ['none', 'No clock'],
      ['60|0', 'Bullet 1 | 0'],
      ['180|0', 'Blitz 3 | 0'],
      ['300|0', 'Blitz 5 | 0'],
      ['600|0', 'Rapid 10 | 0'],
      ['clock', 'Same as Clock tab'],
    ],

    game: null,
    board: null,             // created lazily: chessboard.js needs a visible container to measure
    selected: null,          // square of the tapped/dragged piece, e.g. 'e2'
    pendingPromotion: null,  // { from, to, viaDrag } while the picker is open
    tap: null,               // { square, selectedBefore } between pointerdown and pointerup
    result: null,            // { text, undoable } once the game has ended
    timer: null,
    clockOn: true,
    controlChoice: Store.get('playControl', '600|0'),
    disarmTimers: new Map(), // button -> timeout for two-step confirmations
    el: {},

    init() {
      const $ = (id) => document.getElementById(id);
      Play.el = {
        view: $('view-play'),
        col: $('play-board-col'),
        wrap: $('play-board-wrap'),
        barTop: $('play-bar-top'),
        barBottom: $('play-bar-bottom'),
        statusBox: $('play-status-box'),
        status: $('play-status'),
        substatus: $('play-substatus'),
        newGame: $('play-new'),
        undo: $('play-undo'),
        resign: $('play-resign'),
        flip: $('play-flip'),
        control: $('play-control'),
        moves: $('play-moves'),
        moveCount: $('play-move-count'),
        promo: $('promo-picker'),
        promoChoices: $('promo-choices'),
        promoCancel: $('promo-cancel'),
      };
      Play.game = new Chess();

      Play.buildControlOptions();
      Play.timer = new ChessTimer({
        initialMs: 600000,
        incrementMs: 0,
        onUpdate: Play.renderClocks,
        onFlag: Play.handleFlag,
      });
      Play.applyControl();

      Tabs.onShow.push((name) => { if (name === 'play') Play.show(); });
      window.addEventListener('resize', () => { if (Play.isVisible()) Play.sizeBoard(); });

      // New game only asks for confirmation while a game is in progress.
      Play.el.newGame.addEventListener('click', () => {
        if (Play.inProgress()) Play.confirmThen(Play.el.newGame, Play.newGame);
        else Play.newGame();
      });
      Play.el.resign.addEventListener('click', () => Play.confirmThen(Play.el.resign, Play.resign));
      Play.el.undo.addEventListener('click', Play.undo);
      Play.el.control.addEventListener('change', Play.changeControl);
      Play.el.flip.addEventListener('click', Play.flip);
      Play.el.promoCancel.addEventListener('click', Play.cancelPromotion);
      // Capture phase so we record the selection before chessboard.js's own mousedown handler runs.
      Play.el.wrap.addEventListener('pointerdown', Play.onPointerDown, { capture: true });
      window.addEventListener('pointerup', Play.onPointerUp);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && Play.pendingPromotion) Play.cancelPromotion();
      });
    },

    isVisible() { return !Play.el.view.classList.contains('hidden'); },

    /** Called whenever the Play tab becomes visible. */
    show() {
      if (!Play.board) Play.createBoard();
      Play.buildControlOptions(); // the "Same as Clock tab" label may have changed
      Play.render();
      Play.sizeBoard();           // after render, so the player bars have their real height
    },

    createBoard() {
      Play.board = Chessboard('play-board', {
        draggable: true,
        position: Play.game.fen(),
        pieceTheme: Play.PIECE_URL,
        showNotation: true,
        onDragStart: Play.onDragStart,
        onDrop: Play.onDrop,
        onSnapEnd: Play.onSnapEnd,
      });
    },

    /**
     * Fit the board (plus anything above/below it) inside the visible area.
     * In the side-by-side layout, subtract the panel's width; otherwise the
     * panel is stacked underneath and reached by scrolling.
     */
    sizeBoard() {
      if (!Play.board) return;
      const sideBySide = window.matchMedia(Play.SIDE_BY_SIDE).matches;
      const padding = window.matchMedia('(min-width: 640px)').matches ? 32 : 24; // p-4 / p-3
      const availWidth = Play.el.view.clientWidth - padding - (sideBySide ? 320 + 16 : 0);
      const availHeight = Play.el.view.clientHeight - padding - Play.reservedBarHeight();
      // Multiple of 8 so every square is a whole number of pixels. The 160px floor only
      // matters on very short landscape phones, where fitting on screen beats bigger squares.
      const size = Math.floor(Math.max(160, Math.min(availWidth, availHeight, 720)) / 8) * 8;
      // chessboard.js sizes squares from (container width - 1), so add that pixel back.
      Play.el.col.style.width = (size + 1) + 'px';
      Play.el.wrap.style.width = (size + 1) + 'px';
      Play.board.resize();      // redraws squares, which drops our highlight classes...
      Play.applyHighlights();   // ...so put them back
    },

    /** Height of the player bars above and below the board, plus the gaps between them. */
    reservedBarHeight() {
      return Play.el.barTop.offsetHeight + Play.el.barBottom.offsetHeight + 16;
    },

    flip() {
      if (!Play.board) return;
      Play.board.flip();
      Play.applyHighlights(); // flip redraws the squares too
      Play.render();          // the player bars swap ends with the board
    },

    /** True once the game has ended (board result, flag or resignation). */
    isOver() { return Play.result !== null; },

    /** Moves have been played and the game hasn't ended. */
    inProgress() { return Play.game.history().length > 0 && !Play.isOver(); },

    /** ChessTimer side index for a chess.js colour. */
    sideOf(color) { return color === 'w' ? 0 : 1; },

    other(color) { return color === 'w' ? 'b' : 'w'; },

    // ---- time control ----

    buildControlOptions() {
      Play.el.control.replaceChildren(...Play.CONTROL_OPTIONS.map(([value, label]) => {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = value === 'clock' ? `${label} (${controlLabel(DualClock.control)})` : label;
        return opt;
      }));
      Play.el.control.value = Play.controlChoice;
    },

    /** The selected time control as { initialMs, incrementMs }, or null for "No clock". */
    parseControl(choice) {
      if (choice === 'none') return null;
      if (choice === 'clock') return { ...DualClock.control };
      const [sec, inc] = choice.split('|').map(Number);
      return { initialMs: sec * 1000, incrementMs: inc * 1000 };
    },

    /** Configure the timer from the current choice (resets both sides). */
    applyControl() {
      const control = Play.parseControl(Play.controlChoice);
      Play.clockOn = control !== null;
      if (control) Play.timer.configure(control.initialMs, control.incrementMs);
      else Play.timer.reset();
    },

    /** The dropdown is only enabled before the first move or after the game ends. */
    changeControl() {
      Play.controlChoice = Play.el.control.value;
      Store.set('playControl', Play.controlChoice);
      // Before the first move, apply right away; after a finished game, it applies on New game.
      if (Play.game.history().length === 0) Play.applyControl();
      Play.render();
      requestAnimationFrame(Play.sizeBoard); // bars change height when the clock is hidden/shown
    },

    /** Called after every move: start the clock on move one, otherwise switch turns. */
    updateClockAfterMove() {
      if (!Play.clockOn) return;
      const t = Play.timer;
      if (t.state === 'idle') t.start(Play.sideOf(Play.game.turn()));
      else if (t.state === 'running') t.switchTurn(); // adds the mover's increment
    },

    // ---- game end ----

    /** Result decided by the position itself, or null. Specific draws are checked before in_draw(). */
    boardResult() {
      const g = Play.game;
      if (g.in_checkmate()) {
        return { text: `Checkmate — ${Play.colorName(Play.other(g.turn()))} wins`, undoable: true };
      }
      if (g.in_stalemate()) return { text: 'Draw by stalemate', undoable: true };
      if (g.in_threefold_repetition()) return { text: 'Draw by threefold repetition', undoable: true };
      if (g.insufficient_material()) return { text: 'Draw by insufficient material', undoable: true };
      // in_draw() also covers the cases above; what's left is the 50-move rule.
      if (g.in_draw()) return { text: 'Draw by the 50-move rule', undoable: true };
      return null;
    },

    /**
     * Can `color` still deliver checkmate with its remaining material?
     * Simplified FIDE rule: a lone king, or king plus a single bishop or
     * knight, cannot. Used to turn a time loss into a draw.
     */
    canMate(color) {
      let minors = 0;
      for (const file of 'abcdefgh') {
        for (let rank = 1; rank <= 8; rank++) {
          const p = Play.game.get(file + rank);
          if (!p || p.color !== color || p.type === 'k') continue;
          if (p.type === 'n' || p.type === 'b') minors += 1;
          else return true; // any pawn, rook or queen
        }
      }
      return minors >= 2;
    },

    /** ChessTimer callback: a player's time ran out. */
    handleFlag(side) {
      const loser = side === 0 ? 'w' : 'b';
      const winner = Play.other(loser);
      Play.result = Play.canMate(winner)
        ? { text: `${Play.colorName(winner)} wins on time`, undoable: false }
        : { text: `Draw — ${Play.colorName(loser)} ran out of time, but ${Play.colorName(winner)} can't checkmate`, undoable: false };
      if (Play.pendingPromotion) Play.cancelPromotion();
      Play.selected = null;
      Sound.flag();
      Play.applyHighlights();
      Play.render();
    },

    /** The side to move resigns. */
    resign() {
      if (Play.isOver()) return;
      const mover = Play.game.turn();
      Play.result = { text: `${Play.colorName(mover)} resigns — ${Play.colorName(Play.other(mover))} wins`, undoable: false };
      Play.timer.stop();
      if (Play.pendingPromotion) Play.cancelPromotion();
      Play.selected = null;
      Sound.gameEnd();
      Play.applyHighlights();
      Play.render();
    },

    // ---- game controls ----

    newGame() {
      if (Play.pendingPromotion) Play.closePromotion();
      Play.game.reset();
      Play.result = null;
      Play.selected = null;
      if (Play.board) Play.board.position('start');
      Play.applyControl();
      Play.applyHighlights();
      Play.render();
    },

    /** Undo is allowed during play and after a board result, but not after a flag or resignation. */
    canUndo() {
      return Play.game.history().length > 0 && (!Play.result || Play.result.undoable);
    },

    /**
     * Take back the last move. The clock goes back to the player who is to
     * move again; time already used is not refunded (simple pass-and-play takeback).
     */
    undo() {
      if (!Play.canUndo()) return;
      if (Play.pendingPromotion) Play.closePromotion();
      Play.game.undo();
      Play.result = null;
      Play.selected = null;
      Play.board.position(Play.game.fen());
      if (Play.clockOn) {
        const t = Play.timer;
        if (Play.game.history().length === 0) {
          t.reset(); // back to the start: clock waits for White's first move again
        } else {
          t.giveTurnTo(Play.sideOf(Play.game.turn()));
          if (t.state === 'paused') t.resume(); // the game had ended on the board; play continues
        }
      }
      Sound.move();
      Play.applyHighlights();
      Play.render();
    },

    /**
     * Two-step confirmation without a modal: the first click turns the button
     * red ("Tap to confirm"); a second click within 3 s runs the action.
     */
    confirmThen(btn, action) {
      if (Play.disarmTimers.has(btn)) {
        Play.disarm(btn);
        action();
        return;
      }
      btn.querySelector('.btn-label').textContent = 'Tap to confirm';
      btn.classList.add('!bg-red-600', '!text-white');
      Play.disarmTimers.set(btn, setTimeout(() => Play.disarm(btn), 3000));
    },

    disarm(btn) {
      clearTimeout(Play.disarmTimers.get(btn));
      Play.disarmTimers.delete(btn);
      btn.classList.remove('!bg-red-600', '!text-white');
      Play.renderControls(); // restores the normal label
    },

    // ---- chessboard.js callbacks (drag to move) ----

    onDragStart(source, piece) {
      if (Play.isOver() || Play.pendingPromotion) return false;
      if (piece.charAt(0) !== Play.game.turn()) return false; // only the side to move
      Play.select(source); // show legal targets while dragging
      return true;
    },

    onDrop(source, target) {
      if (source === target) return;          // a tap, handled by onPointerUp
      if (target === 'offboard') return 'snapback';
      const result = Play.tryMove(source, target, true);
      if (result === 'illegal') return 'snapback';
      // 'promotion': the pawn stays on the target square while the picker is open.
    },

    /** After the drop animation, redraw from chess.js (castling rook, en passant, promotion). */
    onSnapEnd() {
      if (!Play.pendingPromotion) Play.board.position(Play.game.fen(), false);
    },

    // ---- tap to move ----

    /** The board square under a screen point, ignoring the dragged piece image on top. */
    squareAt(x, y) {
      for (const node of document.elementsFromPoint(x, y)) {
        const sq = node.closest && node.closest('#play-board [data-square]');
        if (sq) return sq.getAttribute('data-square');
      }
      return null;
    },

    onPointerDown(e) {
      if (e.button !== 0) { Play.tap = null; return; } // ignore right/middle clicks
      const square = Play.squareAt(e.clientX, e.clientY);
      Play.tap = square ? { square, selectedBefore: Play.selected } : null;
    },

    onPointerUp(e) {
      const t = Play.tap;
      Play.tap = null;
      if (!t || Play.squareAt(e.clientX, e.clientY) !== t.square) return; // a drag, or released off the board
      Play.handleTap(t.square, t.selectedBefore);
    },

    handleTap(square, selectedBefore) {
      if (Play.isOver() || Play.pendingPromotion) return;
      // Second tap on a legal destination: make the move.
      if (selectedBefore && selectedBefore !== square && Play.tryMove(selectedBefore, square, false) !== 'illegal') return;
      const piece = Play.game.get(square);
      if (selectedBefore === square) Play.clearSelection();                     // tap again to deselect
      else if (piece && piece.color === Play.game.turn()) Play.select(square);  // pick up (or switch to) a piece
      else Play.clearSelection();
    },

    select(square) {
      Play.selected = square;
      Play.applyHighlights();
    },

    clearSelection() {
      Play.selected = null;
      Play.applyHighlights();
    },

    // ---- making moves ----

    /**
     * Validate from→to against chess.js. Returns 'illegal', 'ok' (move made),
     * or 'promotion' (picker opened; the move is made once a piece is chosen).
     */
    tryMove(from, to, viaDrag) {
      const legal = Play.game.moves({ square: from, verbose: true }).filter((m) => m.to === to);
      if (legal.length === 0) return 'illegal';
      if (legal.some((m) => m.promotion)) {
        Play.openPromotion(from, to, viaDrag);
        return 'promotion';
      }
      Play.makeMove({ from, to }, !viaDrag);
      return 'ok';
    },

    /**
     * Apply a legal move. `syncBoard` redraws the board now; for drags it's
     * false because chessboard.js is still finishing the drop (onSnapEnd syncs).
     */
    makeMove(moveObj, syncBoard) {
      const move = Play.game.move(moveObj);
      if (!move) return null;
      Play.selected = null;
      if (syncBoard) Play.board.position(Play.game.fen());
      Play.afterMove(move);
      return move;
    },

    /** Everything that should happen after any move: clock, game-end check, sound, panel. */
    afterMove(move) {
      Play.updateClockAfterMove();
      // The mover may have run out of time just before completing the move;
      // switchTurn() then flagged and handleFlag() already set the result.
      if (!Play.result) {
        Play.result = Play.boardResult();
        if (Play.result) {
          Play.timer.stop();
          Sound.gameEnd();
        } else if (Play.game.in_check()) Sound.check();
        else if (move.captured) Sound.capture();
        else Sound.move();
      }
      Play.applyHighlights();
      Play.render();
    },

    // ---- promotion picker ----

    openPromotion(from, to, viaDrag) {
      const color = Play.game.turn();
      Play.pendingPromotion = { from, to, viaDrag };
      Play.el.promoChoices.replaceChildren(...Play.PROMOTION_PIECES.map(([p, name]) => {
        const btn = document.createElement('button');
        btn.className = 'rounded-xl bg-slate-700 p-1.5 transition hover:bg-emerald-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400';
        btn.setAttribute('aria-label', name);
        btn.title = name;
        const img = document.createElement('img');
        img.src = Play.PIECE_URL.replace('{piece}', color + p.toUpperCase());
        img.alt = '';
        img.className = 'h-12 w-12 sm:h-14 sm:w-14';
        btn.appendChild(img);
        btn.addEventListener('click', () => Play.choosePromotion(p));
        return btn;
      }));
      Play.el.promo.classList.remove('hidden');
      Play.el.promo.classList.add('flex');
      Play.el.promoChoices.firstElementChild.focus();
    },

    closePromotion() {
      Play.pendingPromotion = null;
      Play.el.promo.classList.add('hidden');
      Play.el.promo.classList.remove('flex');
    },

    choosePromotion(piece) {
      const { from, to } = Play.pendingPromotion;
      Play.closePromotion();
      Play.makeMove({ from, to, promotion: piece }, true);
    },

    /** Abort the promotion: put the pawn back where chess.js says it is. */
    cancelPromotion() {
      Play.closePromotion();
      Play.board.position(Play.game.fen(), false);
      Play.clearSelection();
    },

    // ---- rendering ----

    /** Re-apply square highlights: last move, king in check, selection and its legal targets. */
    applyHighlights() {
      if (!Play.board) return;
      const squares = document.querySelectorAll('#play-board [data-square]');
      const classes = ['sq-last', 'sq-check', 'sq-selected', 'sq-target', 'sq-capture'];
      const marks = {}; // square -> list of classes
      const add = (sq, cls) => { (marks[sq] = marks[sq] || []).push(cls); };

      const history = Play.game.history({ verbose: true });
      const last = history[history.length - 1];
      if (last) { add(last.from, 'sq-last'); add(last.to, 'sq-last'); }

      if (Play.game.in_check()) {
        const king = Play.findKing(Play.game.turn());
        if (king) add(king, 'sq-check');
      }

      if (Play.selected) {
        add(Play.selected, 'sq-selected');
        Play.game.moves({ square: Play.selected, verbose: true }).forEach((m) => {
          // Several promotion moves share one target square; mark it once.
          if (!(marks[m.to] || []).some((c) => c === 'sq-target' || c === 'sq-capture')) {
            add(m.to, m.captured ? 'sq-capture' : 'sq-target');
          }
        });
      }

      squares.forEach((node) => {
        node.classList.remove(...classes);
        const list = marks[node.getAttribute('data-square')];
        if (list) node.classList.add(...list);
      });
    },

    findKing(color) {
      for (const file of 'abcdefgh') {
        for (let rank = 1; rank <= 8; rank++) {
          const sq = file + rank;
          const p = Play.game.get(sq);
          if (p && p.type === 'k' && p.color === color) return sq;
        }
      }
      return null;
    },

    colorName(c) { return c === 'w' ? 'White' : 'Black'; },

    /** The player bar showing `color` (bars follow the board orientation). */
    barFor(color) {
      const bottom = Play.board ? Play.board.orientation().charAt(0) : 'w';
      return color === bottom ? Play.el.barBottom : Play.el.barTop;
    },

    render() {
      Play.renderStatus();
      Play.renderBars();
      Play.renderClocks();
      Play.renderMoves();
      Play.renderControls();
    },

    renderStatus() {
      const g = Play.game;
      const turn = Play.colorName(g.turn());
      let main = `${turn} to move`;
      let sub = '';
      if (Play.result) {
        main = Play.result.text;
        sub = Play.result.undoable ? 'Start a new game, or undo to keep playing.' : 'Start a new game to play again.';
      } else {
        if (g.in_check()) main += ' — check!';
        if (Play.clockOn && Play.timer.state === 'idle') sub = "The clock starts after White's first move.";
      }
      Play.el.status.textContent = main;
      Play.el.substatus.textContent = sub;
      Play.el.substatus.classList.toggle('hidden', !sub);
      Play.el.statusBox.className = 'rounded-xl px-4 py-3 transition-colors ' +
        (Play.result ? 'bg-emerald-500 text-slate-900' : g.in_check() ? 'bg-red-900/60 text-red-100' : 'bg-slate-800 text-slate-100');
      Play.el.substatus.classList.toggle('text-slate-400', !Play.result);
    },

    /**
     * Names, captured pieces and material lead for both bars. Captures come
     * from the move history (so Undo just works); the "+N" lead is counted
     * from the pieces on the board, so promotions are accounted for.
     */
    renderBars() {
      const captured = { w: [], b: [] }; // pieces captured BY each colour
      Play.game.history({ verbose: true }).forEach((m) => { if (m.captured) captured[m.color].push(m.captured); });

      const material = { w: 0, b: 0 };
      for (const file of 'abcdefgh') {
        for (let rank = 1; rank <= 8; rank++) {
          const p = Play.game.get(file + rank);
          if (p) material[p.color] += Play.PIECE_VALUES[p.type];
        }
      }

      ['w', 'b'].forEach((color) => {
        const bar = Play.barFor(color);
        const toMove = !Play.result && Play.game.turn() === color;
        bar.classList.toggle('ring-2', toMove);
        bar.classList.toggle('ring-emerald-500', toMove);
        bar.querySelector('.bar-swatch').className = 'bar-swatch h-3 w-3 shrink-0 rounded-full ' +
          (color === 'w' ? 'bg-slate-100' : 'bg-slate-950 ring-1 ring-slate-500');
        bar.querySelector('.bar-name').textContent = Play.colorName(color);

        // Highest-value captures first; images overlap slightly to save space.
        const enemy = Play.other(color);
        const sorted = captured[color].slice().sort((a, b) => Play.PIECE_VALUES[b] - Play.PIECE_VALUES[a]);
        bar.querySelector('.bar-captured').replaceChildren(...sorted.map((type, i) => {
          const img = document.createElement('img');
          img.src = Play.PIECE_URL.replace('{piece}', enemy + type.toUpperCase());
          img.alt = type;
          img.className = 'h-5 w-5 shrink-0' + (i > 0 ? ' -ml-2' : '');
          return img;
        }));

        const lead = material[color] - material[enemy];
        bar.querySelector('.bar-diff').textContent = lead > 0 ? `+${lead}` : '';
      });
    },

    /** Clock faces only; called by the timer about 20 times a second. */
    renderClocks() {
      const t = Play.timer;
      if (!t || !Play.el.barTop) return; // the ChessTimer constructor fires onUpdate before it's assigned
      ['w', 'b'].forEach((color) => {
        const clock = Play.barFor(color).querySelector('.bar-clock');
        clock.classList.toggle('hidden', !Play.clockOn);
        if (!Play.clockOn) return;
        const side = Play.sideOf(color);
        const ms = t.timeOf(side);
        let style = 'bg-slate-700 text-slate-300';
        if (t.state === 'flagged' && t.flagged === side) style = 'bg-red-600 text-white';
        else if (t.state === 'running' && t.active === side) style = ms < 10000 ? 'bg-amber-400 text-slate-900' : 'bg-emerald-500 text-slate-900';
        clock.className = 'bar-clock tabular shrink-0 rounded-lg px-2.5 py-1 text-lg font-bold leading-none ' + style;
        clock.textContent = formatTime(ms);
      });
    },

    /** Move list in SAN, one row per full move; the latest move is highlighted. */
    renderMoves() {
      const history = Play.game.history();
      const rows = [];
      for (let i = 0; i < history.length; i += 2) {
        const li = document.createElement('li');
        li.className = 'grid grid-cols-[2.5rem_1fr_1fr] items-center gap-1 rounded px-2 py-0.5 odd:bg-slate-900/40';
        const num = document.createElement('span');
        num.className = 'text-slate-500';
        num.textContent = `${i / 2 + 1}.`;
        li.appendChild(num);
        [i, i + 1].forEach((idx) => {
          const cell = document.createElement('span');
          cell.className = 'rounded px-1.5' + (idx === history.length - 1 ? ' bg-emerald-500/25 text-emerald-200' : '');
          cell.textContent = history[idx] || '';
          li.appendChild(cell);
        });
        rows.push(li);
      }
      if (rows.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'px-2 py-1 text-slate-500';
        empty.textContent = 'No moves yet.';
        rows.push(empty);
      }
      Play.el.moves.replaceChildren(...rows);
      Play.el.moves.scrollTop = Play.el.moves.scrollHeight;
      Play.el.moveCount.textContent = history.length ? `Move ${Math.ceil(history.length / 2)}` : '';
    },

    renderControls() {
      const el = Play.el;
      el.undo.disabled = !Play.canUndo();
      el.resign.disabled = Play.isOver();
      el.control.disabled = Play.inProgress();
      el.control.value = Play.controlChoice;
      // Don't overwrite a button that is waiting for its confirmation tap.
      if (!Play.disarmTimers.has(el.resign)) {
        el.resign.querySelector('.btn-label').textContent = Play.isOver() ? 'Resign' : `Resign (${Play.colorName(Play.game.turn())})`;
      }
      if (!Play.disarmTimers.has(el.newGame)) el.newGame.querySelector('.btn-label').textContent = 'New game';
    },
  };

  /* ==================================================================
     TAB 3: FACTS ENGINE
     A curated list of facts shown as a filterable card gallery, plus a
     featured card that "Random fact" (or clicking any card) fills.
     Random never repeats the fact currently featured.
     ================================================================== */
  const Facts = {
    CATEGORIES: {
      History: { icon: '♜', badge: 'bg-sky-500/15 text-sky-300 ring-sky-500/30' },
      Records: { icon: '♛', badge: 'bg-amber-500/15 text-amber-300 ring-amber-500/30' },
      Trivia:  { icon: '♞', badge: 'bg-emerald-500/15 text-emerald-300 ring-emerald-500/30' },
    },

    LIST: [
      { cat: 'History', title: 'Born in India', text: 'Chess traces back to chaturanga, played in India around the 6th century. Its four "divisions of the army" (infantry, cavalry, elephants and chariots) became the pawn, knight, bishop and rook.' },
      { cat: 'History', title: 'The queen used to be weak', text: 'In medieval chess the queen (then the fers, or advisor) could move only one square diagonally. She gained her sweeping modern powers in late-15th-century Europe, which made the game much faster.' },
      { cat: 'History', title: 'The first world champion', text: 'The first official World Chess Championship was played in 1886 in the United States. Wilhelm Steinitz beat Johannes Zukertort and became the first undisputed world champion.' },
      { cat: 'History', title: 'The Mechanical Turk', text: 'The Turk, built in 1770, toured Europe as a chess-playing machine and played Napoleon and Benjamin Franklin. It was a hoax: a strong human player hid inside the cabinet.' },
      { cat: 'History', title: 'The Immortal Game', text: 'In London in 1851, Adolf Anderssen beat Lionel Kieseritzky after giving up a bishop, both rooks and his queen, then checkmating with his three remaining minor pieces.' },
      { cat: 'History', title: 'Machine beats champion', text: "In 1997 IBM's Deep Blue beat world champion Garry Kasparov 3½–2½ in a six-game match, the first time a computer won a match against a reigning champion." },
      { cat: 'History', title: 'FIDE and the Olympiad', text: 'FIDE, the international chess federation, was founded in Paris in 1924. It organised the first official Chess Olympiad in London in 1927.' },
      { cat: 'Records', title: 'Highest rating ever', text: "Magnus Carlsen reached a classical rating of 2882 in May 2014, the highest in the history of FIDE's rating list." },
      { cat: 'Records', title: 'The youngest grandmaster', text: 'Abhimanyu Mishra became the youngest grandmaster in history in 2021, aged 12 years, 4 months and 25 days.' },
      { cat: 'Records', title: 'Judit Polgár', text: "Judit Polgár earned the grandmaster title in 1991 at 15, breaking Bobby Fischer's record as the youngest at the time. She is widely regarded as the strongest female player ever and reached the overall world top 10." },
      { cat: 'Records', title: "Fischer's 20-game streak", text: 'On his way to the 1972 world championship, Bobby Fischer won 20 consecutive games against elite grandmasters, including two 6–0 Candidates match wins over Mark Taimanov and Bent Larsen.' },
      { cat: 'Records', title: 'The longest tournament game', text: 'Ivan Nikolić and Goran Arsović played 269 moves in Belgrade in 1989. The game lasted over 20 hours and ended in a draw.' },
      { cat: 'Records', title: 'Hundreds of boards at once', text: 'In 2011 Iranian grandmaster Ehsan Ghaem Maghami played 604 simultaneous games, winning 580 of them, which set a Guinness world record.' },
      { cat: 'Records', title: 'The longest possible game', text: 'With the 50-move rule in force, the longest possible chess game is estimated at 5,949 moves.' },
      { cat: 'Trivia', title: 'More games than atoms', text: "Claude Shannon estimated about 10^120 possible chess games (the \"Shannon number\"). That's far more than the roughly 10^80 atoms in the observable universe." },
      { cat: 'Trivia', title: 'It explodes quickly', text: 'After one move each there are 400 possible positions. After two moves each there are 197,281 possible games.' },
      { cat: 'Trivia', title: 'Where "checkmate" comes from', text: 'The word comes from the Persian shāh māt, roughly "the king is helpless." "Rook" comes from the Persian rukh, meaning chariot.' },
      { cat: 'Trivia', title: "Fool's Mate", text: 'The fastest possible checkmate takes two moves: 1. f3 e5 2. g4 Qh4#. Try it on the Play tab!' },
      { cat: 'Trivia', title: "The knight's tour", text: 'A knight can visit every one of the 64 squares exactly once. Mathematicians, including Leonhard Euler, have studied this puzzle for centuries.' },
      { cat: 'Trivia', title: 'Fischer invented the increment', text: 'Bobby Fischer patented a digital chess clock in 1988 that adds time after every move, the "increment" used by most modern time controls (and by the Clock tab).' },
      { cat: 'Trivia', title: 'En passant is a late addition', text: 'The en passant capture came in around the 15th century, when pawns gained the option of moving two squares on their first move, so they could not skip past an enemy pawn.' },
    ],

    filter: 'All',
    current: -1,  // index into LIST of the featured fact
    el: {},

    init() {
      const $ = (id) => document.getElementById(id);
      Facts.el = {
        random: $('facts-random'),
        featured: $('facts-featured'),
        tag: $('facts-featured-tag'),
        count: $('facts-featured-count'),
        title: $('facts-featured-title'),
        text: $('facts-featured-text'),
        filters: $('facts-filters'),
        grid: $('facts-grid'),
      };
      Facts.el.random.addEventListener('click', Facts.random);
      Facts.renderFilters();
      Facts.renderGrid();
      Facts.feature(Math.floor(Math.random() * Facts.LIST.length), false);
    },

    /** Indices of the facts in the active category. */
    visible() {
      return Facts.LIST.map((f, i) => i).filter((i) => Facts.filter === 'All' || Facts.LIST[i].cat === Facts.filter);
    },

    /** Feature a random fact from the active category, never the one already shown. */
    random() {
      const pool = Facts.visible().filter((i) => i !== Facts.current);
      if (pool.length === 0) return;
      Facts.feature(pool[Math.floor(Math.random() * pool.length)], true);
    },

    tagEl(cat) {
      const span = document.createElement('span');
      span.className = 'inline-flex items-center gap-1.5 rounded-full px-2.5 py-0.5 text-xs font-semibold ring-1 ring-inset ' + Facts.CATEGORIES[cat].badge;
      span.textContent = `${Facts.CATEGORIES[cat].icon} ${cat}`;
      return span;
    },

    /** Show fact `index` in the featured card, with a short fade unless reduced motion is preferred. */
    feature(index, animate) {
      Facts.current = index;
      const fact = Facts.LIST[index];
      const fill = () => {
        Facts.el.tag.replaceChildren(Facts.tagEl(fact.cat));
        Facts.el.count.textContent = `Fact ${index + 1} of ${Facts.LIST.length}`;
        Facts.el.title.textContent = fact.title;
        Facts.el.text.textContent = fact.text;
        Facts.el.featured.classList.remove('opacity-0', 'translate-y-2');
        Facts.markCurrent();
      };
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!animate || reduced) { fill(); return; }
      Facts.el.featured.classList.add('opacity-0', 'translate-y-2');
      setTimeout(fill, 180);
    },

    renderFilters() {
      Facts.el.filters.replaceChildren(...['All', ...Object.keys(Facts.CATEGORIES)].map((name) => {
        const btn = document.createElement('button');
        const active = Facts.filter === name;
        btn.className = 'rounded-full px-3.5 py-1.5 text-sm font-medium transition ' +
          (active ? 'bg-emerald-500 text-slate-900' : 'bg-slate-800 text-slate-300 hover:bg-slate-700');
        btn.setAttribute('aria-pressed', String(active));
        const count = name === 'All' ? Facts.LIST.length : Facts.LIST.filter((f) => f.cat === name).length;
        btn.textContent = `${name} (${count})`;
        btn.addEventListener('click', () => {
          Facts.filter = name;
          Facts.renderFilters();
          Facts.renderGrid();
        });
        return btn;
      }));
    },

    renderGrid() {
      Facts.el.grid.replaceChildren(...Facts.visible().map((i) => {
        const fact = Facts.LIST[i];
        const card = document.createElement('button');
        card.className = 'flex flex-col items-start gap-2 rounded-2xl border bg-slate-800/70 p-4 text-left transition hover:-translate-y-0.5 hover:border-emerald-500/60 hover:bg-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400';
        card.dataset.index = i;
        card.setAttribute('aria-label', `Feature: ${fact.title}`);
        const title = document.createElement('h4');
        title.className = 'font-semibold text-slate-100';
        title.textContent = fact.title;
        const text = document.createElement('p');
        text.className = 'text-sm leading-relaxed text-slate-400';
        text.textContent = fact.text;
        card.append(Facts.tagEl(fact.cat), title, text);
        card.addEventListener('click', () => {
          Facts.feature(i, true);
          Facts.el.featured.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
        return card;
      }));
      Facts.markCurrent();
    },

    /** Outline the card of the featured fact (toggling classes keeps keyboard focus in place). */
    markCurrent() {
      Facts.el.grid.querySelectorAll('[data-index]').forEach((card) => {
        const isCurrent = Number(card.dataset.index) === Facts.current;
        card.classList.toggle('border-emerald-500', isCurrent);
        card.classList.toggle('border-slate-700', !isCurrent);
      });
    },
  };

  /* ==================================================================
     BOOT
     ================================================================== */
  document.addEventListener('DOMContentLoaded', () => {
    Sound.init();
    DualClock.init();
    Play.init();
    Facts.init();
    Tabs.init();
  });
  </script>
</body>
</html>
